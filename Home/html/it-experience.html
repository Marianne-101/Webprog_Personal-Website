<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>IT Experience</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }
        .experience-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 50%;
            text-align: center;
        }
        .experience-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .experience-box li {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="experience-box">
        <h2>IT Experience</h2>
        <ul>
            <li>Passed Grade School as one of the top students</li>
            <li>Completed Junior High School at Signal Village National High School (with honors)</li>
            <li>Graduated Senior High School at Learn & Explore Montessori School (with honors)</li>
            <li>Currently studying at Asia Pacific College</li>
        </ul>
    </div>
</body>
</html>

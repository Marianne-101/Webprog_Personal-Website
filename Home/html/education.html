<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Education / Achievements</title>
    <style>
        /* Set background image for the entire body */
        body {
            background-image: url('https://github.com/Marianne-101/Webprog_Personal-Website/blob/feature/2_MPL_customize_my_website/Images/stars.jpg?raw=true');
            background-size: cover; /* Cover the whole page */
            background-position: center center; /* Center the image */
            background-attachment: fixed; /* Fix the background image in place */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;  /* Center horizontally */
            align-items: center;     /* Center vertically */
            min-height: 100vh;       /* Take up full height of the viewport */
            margin: 0;
        }
        
        /* Styling the box containing the content */
        .education-box {
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent background to make content readable */
            padding: 40px; /* Increased padding for more space inside the box */
            border-radius: 15px; /* Larger border-radius for a rounder look */
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3); /* Slightly more prominent shadow */
            width: 60%; /* Increased width */
            max-width: 800px; /* Adjusted max-width to allow for a bigger box */
            text-align: center;
        }

        /* List styling for education items */
        .education-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Styling individual list items */
        .education-box li {
            margin: 15px 0; /* Increased margin for list items */
            font-size: 1.2em; /* Larger font size for better readability */
        }

        /* Optional: Style the header for a more prominent look */
        .education-box h2 {
            font-size: 2em; /* Larger heading */
            margin-bottom: 20px; /* Space below the heading */
        }
    </style>
</head>
<body>
    <div class="education-box">
        <h2>Education / Achievements</h2>
        <ul>
            <li>Passed Grade School as one of the top students</li>
            <li>Completed Junior High School at Signal Village National High School (with honors)</li>
            <li>Graduated Senior High School at Learn & Explore Montessori School (with honors)</li>
            <li>Currently studying at Asia Pacific College</li>
        </ul>
    </div>
</body>
</html>

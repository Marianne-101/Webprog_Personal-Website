<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education/Achievements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom right, #f5f7fa, #c3cfe2);
        }

        .education-box {
            width: 400px;
            height: 400px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            line-height: 1.5;
        }

        .education-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .education-box li {
            margin: 10px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="education-box">
        <ul>
            <li>Passed Grade School as one of the top students</li>
            <li>Completed Junior High School at Signal Village National High School (with honors)</li>
            <li>Graduated Senior High School at Learn & Explore Montessori School (with honors)</li>
            <li>Currently studying at Asia Pacific College</li>
        </ul>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Goals in Life</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }
        .education-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 50%;
            text-align: center;
        }
        .education-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .education-box li {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="goals-box">
        <h2>Goals in Life</h2>
        <ul>
            <li>To be successful</li>
                    <li>To give back to those who believe in me</li>
                    <li>Maintain a healthy lifestyle</li>
                    <li>Adventure and exploration</li>
        </ul>
    </div>
</body>
</html>

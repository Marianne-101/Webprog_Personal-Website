<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Hobbies & Interest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }
        .hobbies-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 50%;
            text-align: center;
        }
        .hobbies-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .hobbies-box li {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="hobbies-box">
        <h2>Hobbies & Interest</h2>
        <ul>
            <li>I enjoy going on a Camping</li>
            <li>I've been Hiking since a was kid</li>
            <li>I love Swimming</li>
            <li>I am trying to learn Playing Guitar</li>
            <li>I'm Happy whenever I Travel</li>
        </ul>
    </div>
</body>
</html>

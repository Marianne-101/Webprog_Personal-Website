<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vuejs.css">
    <title>Marianne Web Page</title>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo" data-aos="zoom-in" data-aos-duration="1500">
                <span>Hola! Soy Marianne</span>
            </div>
            <div class="links">
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="100">
                    <a href="html/education.html">Education / Achievements</a>
                </div>
                
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200">
                    <a href="html/it-experience.html">IT Experience</a>
                </div>
                
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="300">
                    <a href="html/hobbies.html">Hobbies & Interest</a>
                </div>                
                
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="400">
                    <a href="html/goals.html">Goals in Life</a>
                </div>                
                
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="500">
                    <a href="html/picture.html">Picture Gallery</a>
                </div>
            
            <i class="fa-solid fa-bars hamburg" onclick="hamburg()"></i>
            
        </div>
        <div class="dropdown">
            <div class="links">
                <a href="html/education.html">Education / Achievements</a>
                <a href="html/it-experience.html">IT Experience</a>
                <a href="html/hobbies.html">Hobbies / Interest</a>
                <a href="html/goals.html">My Goals</a>
                <a href="html/picture.html">Picture Gallery</a>
                <i class="fa-solid fa-xmark cancel" onclick="cancel()"></i>
            </div>
        </div>
    </nav>

    <label for="name">Your Name:</label>
    <input type="text" v-model="name" id="name" placeholder="Enter your name" />
  </div>
  <div>
    <label for="comment">Your Comment:</label>
    <textarea v-model="newComment" id="comment" placeholder="Leave a comment..."></textarea>
  </div>
  <button @click="addComment">Submit</button>
</div>

<div v-if="comments.length > 0">
  <h3>Comments:</h3>
  <ul>
    <li v-for="(comment, index) in comments" :key="index">
      <strong>{{ comment.name }}</strong>: {{ comment.text }} ({{ comment.timestamp }})
    </li>
  </ul>
</div>
</div>  
</section>



<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
<script src="js/vue.js"></script>
<script src="js/comments.js"></script>

</body>
</html>
